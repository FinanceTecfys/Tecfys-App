                    <td className="py-2 pr-3 text-amber-300 text-[10px] leading-tight">
                      {p.warnings.length === 0 ? <span className="text-slate-600">—</span> : p.warnings.map((w,i) => <div key={i}>· {w}</div>)}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div className="p-5 border-t border-ink-700 flex items-center justify-between bg-ink-800/40">
          <div className="text-xs text-slate-400">
            Approve to add all {preview.length} operations to the Loan Book. Rows with warnings can still be imported — you can edit them individually afterwards.
          </div>
          <div className="flex items-center gap-2">
            <button onClick={onCancel} className="border border-ink-700 text-slate-300 hover:text-white px-4 py-2 rounded text-xs font-semibold">Cancel</button>
            <button onClick={onConfirm} className="bg-mint-500 text-ink-950 hover:bg-mint-400 px-5 py-2 rounded text-xs font-bold flex items-center gap-2">{I.check} Import {preview.length}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function LoanBook({ loanbook, deleteLoan, setView, pushToast, criteria, registerLoan }) {
  const [filter, setFilter] = useState({ rating: '', sector: '', country: '', partner: '' });
  const [preview, setPreview] = useState(null);      // rows parsed from Excel awaiting confirmation
  const [importing, setImporting] = useState(false);
  const fileInputRef = React.useRef(null);
  const filtered = useMemo(() => loanbook.filter(l =>
    (!filter.rating || l.rating === filter.rating) &&
    (!filter.sector || l.sector === filter.sector) &&
    (!filter.country || l.country === filter.country) &&
    (!filter.partner || (l.partner || '').toLowerCase().includes(filter.partner.toLowerCase()))
  ), [loanbook, filter]);

  const sectors = [...new Set(loanbook.map(l => l.sector).filter(Boolean))];
  const countries = [...new Set(loanbook.map(l => l.country).filter(Boolean))];

  const exposureByCif = useMemo(() => {
    const m = {};
    loanbook.forEach(l => { if (l.cif) m[l.cif] = (m[l.cif] || 0) + (l.amount || 0); });
    return m;
  }, [loanbook]);

  const exportCsv = () => {
    const headers = ['ID','Date','CIF','Client','Country','Sector','Partner','Distributor','Product','Asset type','Amount','Duration (m)','Interval payment','Frequency','Asset value (CAPEX)','Residual','IRR (annualized)','Rating','Score','Credit opinion','Decision'];
    const rows = filtered.map(l => [l.id, l.date, l.cif, l.name, l.country, l.sector, l.partner, l.distributor || '', l.productName || '', l.assetType, l.amount, l.durationMonths, l.intervalPayment, l.paymentFrequency, l.assetValue, l.residualValue, l.irr, l.rating, l.totalScore, l.creditOpinion, l.decision]);
    const csv = [headers, ...rows].map(r => r.map(c => `"${(c ?? '').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `tecfys_loanbook_${new Date().toISOString().slice(0,10)}.csv`; a.click();
    URL.revokeObjectURL(url);
    pushToast('Loan book exported as CSV.', 'success');
  };

  const downloadTemplate = () => {
    try {
      const buf = buildLoanBookTemplate();
      const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'tecfys_loanbook_template.xlsx'; a.click();
      URL.revokeObjectURL(url);
      pushToast('Template downloaded — fill each column with one operation.', 'info');
    } catch (e) {
      pushToast('Failed to build template: ' + e.message, 'error');
    }
  };

  const onFileChosen = async (e) => {
    const file = e.target.files?.[0];
    if (file) fileInputRef.current.value = '';   // allow re-selecting the same file later
    if (!file) return;
    setImporting(true);
    try {
      const buf = await file.arrayBuffer();
      const parsed = await parseLoanBookExcel(buf, criteria);
      setPreview(parsed);
    } catch (err) {
      pushToast('Import failed: ' + err.message, 'error');
    }
    setImporting(false);
  };

  const confirmImport = async () => {
    if (!preview) return;
    let approved = 0, rejected = 0;
    for (const p of preview) {
      const s = p.scoreResult;
      const f = p.financials;
      const op = {
        id: Date.now() + Math.floor(Math.random() * 10000),
        date: new Date().toISOString().slice(0,10),
        cif: f.cif,
        name: f.name,
        country: f.country,
        sector: f.sector,
        amount: f.amount ?? f.assetValue ?? 0,
        durationMonths: f.durationMonths,
        intervalPayment: f.intervalPayment,
        paymentFrequency: f.paymentFrequency,
        distributor: f.distributor,
        assetType: f.assetType,
        productName: f.productName,
        assetValue: f.assetValue,
        residualValue: f.residualValue,
        partner: f.partner,
        irr: f.irr,
        rating: s.finalRating,
        totalScore: s.totalScore,
        creditOpinion: s.creditOpinion,
        decision: s.decision,
        adjustedEbitda: s.adjustedEbitda,
        financials: f,
        _importedAt: new Date().toISOString(),
      };
      await registerLoan(op);
      if (s.decision === 'reject') rejected++; else approved++;
    }
    setPreview(null);
    pushToast(`Imported ${preview.length} operation${preview.length===1?'':'s'} · ${approved} approvable · ${rejected} flagged reject.`, 'success');
  };

  return (
    <div className="space-y-6">
      <input ref={fileInputRef} type="file" accept=".xlsx,.xls" onChange={onFileChosen} className="hidden"/>
      <div className="flex items-center justify-between">
        <div>
          <h2 className="text-2xl font-bold">Loan book</h2>
          <p className="text-sm text-slate-400 mt-1">All approved operations with cumulative exposure per CIF.</p>
        </div>
        <div className="flex gap-2">
          <button onClick={downloadTemplate}
            title="Download an .xlsx template pre-filled with the expected labels"
            className="flex items-center gap-2 border border-ink-700 text-slate-300 hover:text-mint-400 px-3 py-2 rounded-md text-sm">
            {I.download} Template
          </button>
          <button onClick={() => fileInputRef.current?.click()} disabled={importing}
            className="flex items-center gap-2 border border-mint-500/40 text-mint-400 hover:bg-mint-500/10 px-3 py-2 rounded-md text-sm disabled:opacity-50">
            {importing
              ? <><span className="w-3.5 h-3.5 border-2 border-mint-400 border-t-transparent rounded-full animate-spin"/> Parsing…</>
              : <>{I.upload} Import Excel</>}
          </button>
          <button onClick={exportCsv} className="flex items-center gap-2 border border-ink-700 text-slate-300 hover:text-mint-400 px-3 py-2 rounded-md text-sm">{I.download} Export CSV</button>
          <button onClick={() => setView('new')} className="flex items-center gap-2 bg-mint-500 text-ink-950 font-semibold px-4 py-2 rounded-md hover:bg-mint-400 transition text-sm">{I.plus} New scoring</button>
        </div>
      </div>

      {preview && <LoanImportPreview preview={preview} onCancel={() => setPreview(null)} onConfirm={confirmImport}/>}

      <Card>
        <div className="grid grid-cols-4 gap-3">
          <Field label="Rating" value={filter.rating} onChange={v => setFilter(f => ({...f, rating: v}))} options={RATINGS_ORDERED}/>
          <Field label="Sector" value={filter.sector} onChange={v => setFilter(f => ({...f, sector: v}))} options={sectors}/>
          <Field label="Country" value={filter.country} onChange={v => setFilter(f => ({...f, country: v}))} options={countries}/>
          <Field label="Partner" value={filter.partner} onChange={v => setFilter(f => ({...f, partner: v}))}/>
        </div>
      </Card>

      {filtered.length === 0 ? (
        <Card>
          <div className="text-sm text-slate-500 italic py-12 text-center">
            <div className="mb-3">No operations match the current filters.</div>
            <button onClick={() => setFilter({rating:'',sector:'',country:'',partner:''})} className="text-mint-400 hover:text-mint-300 underline text-sm">Clear filters</button>
          </div>
        </Card>
      ) : (
        <Card>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-[10px] uppercase tracking-[0.14em] text-slate-500 border-b border-ink-700">
                  <th className="text-left py-2 px-2 font-medium">Date</th>
                  <th className="text-left py-2 px-2 font-medium">CIF</th>
                  <th className="text-left py-2 px-2 font-medium">Client</th>
                  <th className="text-left py-2 px-2 font-medium">Sector</th>
                  <th className="text-left py-2 px-2 font-medium">Country</th>
                  <th className="text-left py-2 px-2 font-medium">Partner</th>
                  <th className="text-right py-2 px-2 font-medium">Amount</th>
                  <th className="text-right py-2 px-2 font-medium">Duration</th>
                  <th className="text-center py-2 px-2 font-medium">Rating</th>
                  <th className="text-right py-2 px-2 font-medium">Credit limit</th>
                  <th className="text-right py-2 px-2 font-medium">Cum. exp.</th>
                  <th className="text-right py-2 px-2 font-medium">IRR</th>
                  <th className="w-8"></th>
                </tr>
              </thead>
              <tbody>
                {filtered.slice().reverse().map(l => (
                  <tr key={l.id} className="border-b border-ink-800/60 hover:bg-ink-800/30">
                    <td className="py-2.5 px-2 text-slate-400 num text-xs">{l.date}</td>
                    <td className="py-2.5 px-2 num text-slate-200 text-xs">{l.cif}</td>
                    <td className="py-2.5 px-2 text-slate-100 text-xs">{l.name}</td>
                    <td className="py-2.5 px-2 text-slate-400 text-xs">{l.sector}</td>
                    <td className="py-2.5 px-2 text-slate-400 num text-xs">{l.country}</td>
                    <td className="py-2.5 px-2 text-slate-400 text-xs">{l.partner || '—'}</td>
                    <td className="py-2.5 px-2 num text-right text-xs">{fmtEur(l.amount)}</td>
                    <td className="py-2.5 px-2 num text-right text-xs text-slate-400">{l.durationMonths ? l.durationMonths + 'm' : '—'}</td>
                    <td className="py-2.5 px-2 text-center"><RatingBadge r={l.rating} size="sm"/></td>
                    <td className="py-2.5 px-2 num text-right text-mint-400 text-xs">{fmtEur(l.creditOpinion)}</td>
                    <td className="py-2.5 px-2 num text-right text-xs">{fmtEur(exposureByCif[l.cif])}</td>
                    <td className="py-2.5 px-2 num text-right text-xs text-slate-400">{l.irr ? fmtPct(l.irr) : '—'}</td>
                    <td className="py-2.5 px-2">
                      <button onClick={() => { if (confirm('Delete operation ' + l.name + '?')) deleteLoan(l.id); }}
                        className="text-slate-600 hover:text-red-400 transition">{I.trash}</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>
      )}
    </div>
  );
}

/* =====================================================================
   VIEW: Criteria Editor
   ===================================================================== */
function CriteriaEditor({ criteria, setCriteria, pushToast }) {
  const [tab, setTab] = useState('weights');

  const updateWeight = (key, val) => {
    setCriteria(prev => ({ ...prev, weights: { ...prev.weights, [key]: parseFloat(val) || 0 } }));
  };
  const updateThreshold = (ratio, rating, val) => {
    setCriteria(prev => ({
      ...prev,
      ratios: {
        ...prev.ratios,
        [ratio]: {
          ...prev.ratios[ratio],
          tiers: prev.ratios[ratio].tiers.map(([r, t]) => r === rating ? [r, parseFloat(val) || 0] : [r, t])
        }
      }
    }));
  };
  const updatePrudence = (rating, val) => {
    setCriteria(prev => ({ ...prev, prudence: { ...prev.prudence, [rating]: parseFloat(val) || 0 } }));
  };
  const updateRatingScore = (ratioKey, rating, val) => {
    setCriteria(prev => ({
      ...prev,
      ratios: {
        ...prev.ratios,
        [ratioKey]: {
          ...prev.ratios[ratioKey],
          scoreTable: {
            ...(prev.ratios[ratioKey].scoreTable || {}),
            [rating]: parseFloat(val) || 0,
          }
        }
      }
    }));
  };
  const updateSectorRating = (sector, val) => {
    setCriteria(prev => ({ ...prev, sectorRating: { ...prev.sectorRating, [sector]: val } }));
  };
  const updateBucket = (rating, val) => {
    setCriteria(prev => ({
      ...prev,
      scoreBuckets: prev.scoreBuckets.map(([r, lb]) => r === rating ? [r, parseFloat(val) || 0] : [r, lb])
    }));
  };
  const updateDecision = (rating, val) => {
    setCriteria(prev => ({ ...prev, decisionRules: { ...prev.decisionRules, [rating]: val } }));
  };

  const resetAll = () => {
    if (confirm('Reset all criteria to defaults? This cannot be undone.')) {
      setCriteria(DEFAULT_CRITERIA);
      pushToast('Criteria reset to defaults.', 'success');
    }
  };

  const weightSum = Object.values(criteria.weights).reduce((s,v) => s+v, 0);

  const TABS = [
    { id: 'weights', label: 'Ratio weights' },
    { id: 'thresholds', label: 'Rating thresholds' },
    { id: 'scores', label: 'Scoring matrix' },
    { id: 'buckets', label: 'Score → final rating' },
    { id: 'prudence', label: 'Prudence factors' },
    { id: 'sectors', label: 'Sector ratings' },
    { id: 'decisions', label: 'Decision rules' },
  ];

  return (
    <div className="space-y-6">
      <div className="flex items-center justify-between">
        <div>
          <h2 className="text-2xl font-bold">Criteria &amp; settings</h2>
          <p className="text-sm text-slate-400 mt-1">Tune scoring thresholds, weights, sector mappings and approval rules. Changes are saved automatically.</p>
        </div>
        <button onClick={resetAll} className="flex items-center gap-2 border border-ink-700 text-slate-300 hover:text-red-400 px-3 py-2 rounded-md text-sm">{I.reset} Reset to defaults</button>
      </div>

      <div className="flex border-b border-ink-700 overflow-x-auto">
        {TABS.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)}
            className={"px-4 py-2.5 text-xs uppercase tracking-[0.14em] font-medium border-b-2 -mb-px whitespace-nowrap " +
              (tab === t.id ? 'border-mint-500 text-mint-400' : 'border-transparent text-slate-400 hover:text-slate-200')}>
            {t.label}
          </button>
        ))}
      </div>

      {tab === 'weights' && (
        <Card title={`Ratio weights · sum: ${fmtPct(weightSum,0)} (target 100%)`} subtitle="Weight applied to each ratio's rating score (1-10) to compute total weighted score.">
          <div className="space-y-3">
            {Object.entries(criteria.ratios).map(([key, def]) => (
              <div key={key} className="grid grid-cols-12 gap-3 items-center">
                <div className="col-span-3 text-sm text-slate-200 font-medium">{def.label}</div>
                <div className="col-span-4 text-xs text-slate-500 italic">{def.formula}</div>
                <div className="col-span-3">
                  <div className="h-2 bg-ink-800 rounded overflow-hidden">
                    <div className="h-full bg-mint-500" style={{ width: ((criteria.weights[key]||0)*100*3) + '%', maxWidth: '100%' }}/>
                  </div>
                </div>
                <div className="col-span-2">
                  <div className="relative">
                    <input type="number" step="0.01" value={criteria.weights[key] ?? 0}
                      onChange={e => updateWeight(key, e.target.value)}
                      className="w-full bg-ink-800 border border-ink-700 rounded-md px-3 py-1.5 text-sm text-slate-100 num pr-7"/>
                    <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-slate-500">×</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
          {Math.abs(weightSum - 1) > 0.001 && (
            <div className="mt-4 px-3 py-2 bg-yellow-500/10 border border-yellow-500/30 rounded-md text-xs text-yellow-300 flex items-start gap-2">
              {I.alert} Weight sum is {fmtPct(weightSum,0)} — should equal 100% for balanced scoring.
            </div>
          )}
        </Card>
      )}

      {tab === 'thresholds' && (
        <div className="space-y-4">
          {Object.entries(criteria.ratios).filter(([k,d]) => d.direction !== 'rating').map(([key, def]) => (
            <Card key={key} title={def.label} subtitle={`${def.formula} · direction: ${def.direction === 'higher' ? 'higher value = better' : 'lower value = better'}`}>
              <div className="grid grid-cols-8 gap-2">
                {def.tiers.map(([r, t]) => (
                  <div key={r}>
                    <div className="text-[10px] uppercase tracking-[0.14em] text-slate-500 mb-1 text-center">{r}</div>
                    <input type="number" step="0.01" value={t}
                      onChange={e => updateThreshold(key, r, e.target.value)}
                      className="w-full bg-ink-800 border border-ink-700 rounded-md px-2 py-1.5 text-xs text-slate-100 num text-center"/>
                  </div>
                ))}
              </div>
            </Card>
          ))}
        </div>
      )}

      {tab === 'scores' && (
        <Card title="Scoring matrix" subtitle="Each ratio has its own normalisation: a value's rating maps to a per-ratio score (1-10). Score × weight gives the contribution. Column totals show the final score for a company that scores at the same rating across every ratio.">
          <div className="overflow-x-auto">
            <table className="w-full text-xs">
              <thead>
                <tr className="border-b border-ink-700">
                  <th className="text-left py-2 pr-3 font-medium text-slate-300">Ratio</th>
                  <th className="text-right py-2 px-2 font-medium text-slate-400 w-16">Weight</th>
                  {RATINGS_ORDERED.map(r => (
                    <th key={r} className="px-1.5 py-2 text-center font-medium">
                      <div className="flex justify-center"><RatingBadge r={r} size="sm"/></div>
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {Object.entries(criteria.ratios).map(([key, def]) => {
                  const weight = criteria.weights[key] || 0;
                  return (
                    <tr key={key} className="border-b border-ink-800/60 hover:bg-ink-800/30">
                      <td className="py-2 pr-3">
                        <div className="font-medium text-slate-200">{def.label}</div>
                        <div className="text-[10px] text-slate-500 num">{def.formula}</div>
                      </td>
                      <td className="py-2 px-2 num text-right text-mint-400 font-semibold">{(weight*100).toFixed(0)}%</td>
                      {RATINGS_ORDERED.map(r => {
                        const v = def.scoreTable?.[r] ?? 0;
                        return (
                          <td key={r} className="px-1 py-1">
                            <input type="number" step="0.1" value={v}
                              onChange={e => updateRatingScore(key, r, e.target.value)}
                              className="w-full bg-ink-800 border border-ink-700 rounded px-1.5 py-1 text-xs text-slate-100 num text-center focus:border-mint-500"/>
                          </td>
                        );
                      })}
                    </tr>
                  );
                })}
                {/* Column totals row */}
                <tr className="border-t-2 border-mint-500/30 bg-mint-500/[0.04]">
                  <td className="py-3 pr-3 text-[11px] uppercase tracking-[0.14em] text-mint-400 font-semibold">Column total</td>
                  <td className="py-3 px-2 num text-right text-slate-300">{((Object.values(criteria.weights).reduce((s,v)=>s+v,0))*100).toFixed(0)}%</td>
                  {RATINGS_ORDERED.map(r => {
                    const colTotal = Object.entries(criteria.ratios).reduce((sum, [k, def]) =>
                      sum + (def.scoreTable?.[r] ?? 0) * (criteria.weights[k] || 0), 0);
                    return (
                      <td key={r} className="px-1 py-3 num text-center text-sm font-bold text-mint-300">{colTotal.toFixed(3)}</td>
                    );
                  })}
                </tr>
              </tbody>
            </table>
          </div>
          <div className="mt-4 p-3 bg-ink-800/40 border border-ink-700 rounded text-[11px] text-slate-400 leading-relaxed">
            <strong className="text-slate-300">How to read this:</strong> Each row is a ratio with its weight (sums to 100%). Each cell is the normalised score (1-10) for that ratio at that rating. Final company score = Σ (score<sub>i</sub> × weight<sub>i</sub>). The bottom row shows what a company scoring uniformly at each rating would get — and these are the natural lower bounds for the <span className="text-mint-400">Score → final rating</span> tab.
          </div>
        </Card>
      )}

      {tab === 'buckets' && (
        <Card title="Score buckets → final rating" subtitle="Total weighted score is mapped to the final rating based on lower bound.">
          <div className="space-y-2">
            {criteria.scoreBuckets.map(([r, lb], idx) => (
              <div key={r} className="grid grid-cols-12 gap-3 items-center">
                <div className="col-span-2 flex"><RatingBadge r={r}/></div>
                <div className="col-span-2 text-xs text-slate-500">if score ≥</div>
                <div className="col-span-2">
                  <input type="number" step="0.1" value={lb}
                    onChange={e => updateBucket(r, e.target.value)}
                    className="w-full bg-ink-800 border border-ink-700 rounded-md px-3 py-1.5 text-sm text-slate-100 num"/>
                </div>
                <div className="col-span-6 text-xs text-slate-500">
                  {idx === 0 ? `Range: ≥ ${lb}` : `Range: ${lb} ≤ score < ${criteria.scoreBuckets[idx-1][1]}`}
                </div>
              </div>
            ))}
          </div>
        </Card>
      )}

      {tab === 'prudence' && (
        <Card title="Factorial prudence" subtitle="Credit opinion = Adjusted EBITDA × prudence factor (selected by final rating).">
          <div className="grid grid-cols-8 gap-3">
            {RATINGS_ORDERED.map(r => (
              <div key={r}>
                <div className="flex justify-center mb-2"><RatingBadge r={r}/></div>
                <input type="number" step="0.01" value={criteria.prudence[r]}
                  onChange={e => updatePrudence(r, e.target.value)}
                  className="w-full bg-ink-800 border border-ink-700 rounded-md px-2 py-1.5 text-sm text-slate-100 num text-center"/>
                <div className="text-[10px] text-slate-500 text-center mt-1">{fmtPct(criteria.prudence[r],0)}</div>
              </div>
            ))}
          </div>
          <div className="mt-4 px-3 py-2 bg-mint-500/10 border border-mint-500/30 rounded-md text-xs text-mint-300 flex items-start gap-2">
            {I.info} Example: EBITDA 10,000 × AA prudence (0.25) = 2,500 credit opinion.
          </div>
        </Card>
      )}

      {tab === 'sectors' && (
        <Card title="Sector → rating" subtitle="Each sector is assigned a base rating used in the sectorial risk component.">
          <div className="grid grid-cols-2 gap-x-6 gap-y-2">
            {Object.entries(criteria.sectorRating).map(([s, r]) => (
              <div key={s} className="flex items-center justify-between gap-3 border-b border-ink-800 py-2">
                <span className="text-sm text-slate-200 flex-1">{s}</span>
                <select value={r} onChange={e => updateSectorRating(s, e.target.value)}
                  className="bg-ink-800 border border-ink-700 rounded-md px-2 py-1 text-xs text-slate-100 num">
                  {RATINGS_ORDERED.map(rr => <option key={rr} value={rr}>{rr}</option>)}
                </select>
              </div>
            ))}
          </div>
        </Card>
      )}

      {tab === 'decisions' && (
        <Card title="Decision rules" subtitle="Outcome assigned automatically per final rating.">
          <div className="space-y-2">
            {RATINGS_ORDERED.map(r => (
              <div key={r} className="grid grid-cols-12 gap-3 items-center">
                <div className="col-span-2"><RatingBadge r={r}/></div>
                <div className="col-span-6">
                  <select value={criteria.decisionRules[r]} onChange={e => updateDecision(r, e.target.value)}
                    className="w-full bg-ink-800 border border-ink-700 rounded-md px-3 py-1.5 text-sm text-slate-100">
                    <option value="auto">Auto approved</option>
                    <option value="limited">Approved with limits</option>
                    <option value="manual">Manual review</option>
                    <option value="reject">Rejected</option>
                  </select>
                </div>
                <div className="col-span-4"><Decision d={criteria.decisionRules[r]}/></div>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
}

/* =====================================================================
   VIEW: Pricing Catalog (CRUD)
   ===================================================================== */
function PricingEditor({ pricing, setPricing, pushToast }) {
  const [filter, setFilter] = useState({ distributor: '', assetType: '' });
  const [draft, setDraft] = useState({ distributor: '', assetType: '', productName: '', durationMonths: 12, priceCAPEX: '', installment: '', residualValue: '' });
  const [editingId, setEditingId] = useState(null);

  const distributors = useMemo(() => [...new Set(pricing.map(p => p.distributor))].sort(), [pricing]);
  const assetTypes = useMemo(() => [...new Set(pricing.map(p => p.assetType))].sort(), [pricing]);

  const filtered = pricing.filter(p =>
    (!filter.distributor || p.distributor === filter.distributor) &&
    (!filter.assetType || p.assetType === filter.assetType)
  ).sort((a, b) =>
    a.distributor.localeCompare(b.distributor) ||
    a.assetType.localeCompare(b.assetType) ||
    a.productName.localeCompare(b.productName) ||
    a.durationMonths - b.durationMonths
  );

  const updateRow = (id, field, val) => {
    setPricing(pricing.map(p => p.id === id ? { ...p, [field]: val } : p));
  };
  const deleteRow = (id) => {
    if (!window.confirm('Delete this pricing entry?')) return;
    setPricing(pricing.filter(p => p.id !== id));
    pushToast('Pricing entry deleted.', 'info');
  };
  const addRow = () => {
    if (!draft.distributor || !draft.assetType || !draft.productName || !draft.priceCAPEX || !draft.installment) {
      pushToast('Distributor, asset type, product, CAPEX and installment are required.', 'error');
      return;
    }
    const row = {
      id: 'prc_' + Date.now(),
      distributor: draft.distributor.trim(),
      assetType: draft.assetType.trim(),
      productName: draft.productName.trim(),
      durationMonths: parseInt(draft.durationMonths) || 12,
      priceCAPEX: parseFloat(draft.priceCAPEX) || 0,
      installment: parseFloat(draft.installment) || 0,
      residualValue: parseFloat(draft.residualValue) || 0,
    };
    setPricing([...pricing, row]);
    setDraft({ distributor: draft.distributor, assetType: draft.assetType, productName: '', durationMonths: 12, priceCAPEX: '', installment: '', residualValue: '' });
    pushToast('Pricing entry added.', 'success');
  };
  const resetToSeed = () => {
    if (!window.confirm('Reset the entire pricing catalog to the original 110 default entries? Custom rows will be lost.')) return;
    setPricing(PRICING_SEED);
    pushToast('Catalog reset to default seed.', 'info');
  };

  const irrFor = (p) => computeTargetIRR({
    assetValue: p.priceCAPEX, intervalPayment: p.installment, residualValue: p.residualValue, durationMonths: p.durationMonths, paymentFrequency: 'monthly',
  });

  const dCls = "bg-ink-800 border border-ink-700 rounded px-2 py-1 text-xs text-slate-100 w-full focus:border-mint-500";

  return (
    <div className="space-y-6">
      <div className="flex items-end justify-between">
        <div>
          <h2 className="text-2xl font-bold">Pricing catalog</h2>
          <p className="text-sm text-slate-400 mt-1">Distributor → asset → product → duration. Feeds the Operation Details auto-fill in New Scoring.</p>
        </div>
        <div className="flex items-center gap-2">
          <div className="text-xs text-slate-500 mr-2">{pricing.length} entries</div>
          <button onClick={resetToSeed} className="flex items-center gap-2 border border-ink-700 text-slate-300 hover:text-white px-3 py-2 rounded-md text-xs">{I.reset} Reset to seed</button>
        </div>
      </div>

      <Card title="Add new product">
        <div className="grid grid-cols-7 gap-2 items-end">
          <div>
            <span className="block text-[10px] uppercase tracking-wider text-slate-500 mb-1">Distributor</span>
            <input value={draft.distributor} onChange={e => setDraft({...draft, distributor: e.target.value})} placeholder="e.g. NICTON PLUS" list="dist-list" className={dCls}/>
            <datalist id="dist-list">{distributors.map(d => <option key={d} value={d}/>)}</datalist>
          </div>
          <div>
            <span className="block text-[10px] uppercase tracking-wider text-slate-500 mb-1">Asset type</span>
            <input value={draft.assetType} onChange={e => setDraft({...draft, assetType: e.target.value})} placeholder="e.g. Laptops" list="atype-list" className={dCls}/>
            <datalist id="atype-list">{assetTypes.map(a => <option key={a} value={a}/>)}</datalist>
          </div>
          <div>
            <span className="block text-[10px] uppercase tracking-wider text-slate-500 mb-1">Product name</span>
            <input value={draft.productName} onChange={e => setDraft({...draft, productName: e.target.value})} placeholder="e.g. ASUS" className={dCls}/>
          </div>
          <div>
            <span className="block text-[10px] uppercase tracking-wider text-slate-500 mb-1">Duration (m)</span>
            <input type="number" value={draft.durationMonths} onChange={e => setDraft({...draft, durationMonths: e.target.value})} className={dCls + ' num'}/>
          </div>
          <div>
            <span className="block text-[10px] uppercase tracking-wider text-slate-500 mb-1">Price CAPEX (€)</span>
            <input type="number" step="0.01" value={draft.priceCAPEX} onChange={e => setDraft({...draft, priceCAPEX: e.target.value})} className={dCls + ' num'}/>
          </div>
          <div>
            <span className="block text-[10px] uppercase tracking-wider text-slate-500 mb-1">Installment (€)</span>
            <input type="number" step="0.0001" value={draft.installment} onChange={e => setDraft({...draft, installment: e.target.value})} className={dCls + ' num'}/>
          </div>
          <div className="flex gap-2">
            <div className="flex-1">
              <span className="block text-[10px] uppercase tracking-wider text-slate-500 mb-1">Residual (€)</span>
              <input type="number" step="0.0001" value={draft.residualValue} onChange={e => setDraft({...draft, residualValue: e.target.value})} className={dCls + ' num'}/>
            </div>
            <button onClick={addRow} className="bg-mint-500 text-ink-950 font-bold px-3 py-1 rounded text-xs hover:bg-mint-400 transition self-end">{I.plus}</button>
          </div>
        </div>
      </Card>

      <Card title={"Catalog (" + filtered.length + " of " + pricing.length + " shown)"}>
        <div className="flex gap-3 mb-3 items-end">
          <div className="w-56">
            <span className="block text-[10px] uppercase tracking-wider text-slate-500 mb-1">Filter by distributor</span>
            <select value={filter.distributor} onChange={e => setFilter({...filter, distributor: e.target.value})} className={dCls}>
              <option value="">— All —</option>
              {distributors.map(d => <option key={d} value={d}>{d}</option>)}
            </select>
          </div>
          <div className="w-56">
            <span className="block text-[10px] uppercase tracking-wider text-slate-500 mb-1">Filter by asset type</span>
            <select value={filter.assetType} onChange={e => setFilter({...filter, assetType: e.target.value})} className={dCls}>
              <option value="">— All —</option>
              {assetTypes.map(a => <option key={a} value={a}>{a}</option>)}
            </select>
          </div>
          {(filter.distributor || filter.assetType) && (
            <button onClick={() => setFilter({distributor: '', assetType: ''})} className="text-xs text-slate-400 hover:text-mint-400 underline">Clear filters</button>
          )}
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-[10px] uppercase tracking-[0.12em] text-slate-500 border-b border-ink-700">
                <th className="text-left py-2 px-2 font-medium">Distributor</th>
                <th className="text-left py-2 px-2 font-medium">Asset type</th>
                <th className="text-left py-2 px-2 font-medium">Product</th>
                <th className="text-right py-2 px-2 font-medium">Duration</th>
                <th className="text-right py-2 px-2 font-medium">Price CAPEX</th>
                <th className="text-right py-2 px-2 font-medium">Installment</th>
                <th className="text-right py-2 px-2 font-medium">Residual</th>
                <th className="text-right py-2 px-2 font-medium">IRR (ann.)</th>
                <th className="text-right py-2 px-2 font-medium"></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(p => {
                const editing = editingId === p.id;
                const irr = irrFor(p);
                return (
                  <tr key={p.id} className="border-b border-ink-800/60 hover:bg-ink-800/30 transition">
                    {editing ? (
                      <>
                        <td className="py-1.5 px-2"><input value={p.distributor} onChange={e => updateRow(p.id, 'distributor', e.target.value)} className={dCls}/></td>
                        <td className="py-1.5 px-2"><input value={p.assetType} onChange={e => updateRow(p.id, 'assetType', e.target.value)} className={dCls}/></td>
                        <td className="py-1.5 px-2"><input value={p.productName} onChange={e => updateRow(p.id, 'productName', e.target.value)} className={dCls}/></td>
                        <td className="py-1.5 px-2"><input type="number" value={p.durationMonths} onChange={e => updateRow(p.id, 'durationMonths', parseInt(e.target.value) || 0)} className={dCls + ' num text-right'}/></td>
                        <td className="py-1.5 px-2"><input type="number" step="0.01" value={p.priceCAPEX} onChange={e => updateRow(p.id, 'priceCAPEX', parseFloat(e.target.value) || 0)} className={dCls + ' num text-right'}/></td>
                        <td className="py-1.5 px-2"><input type="number" step="0.0001" value={p.installment} onChange={e => updateRow(p.id, 'installment', parseFloat(e.target.value) || 0)} className={dCls + ' num text-right'}/></td>
                        <td className="py-1.5 px-2"><input type="number" step="0.0001" value={p.residualValue} onChange={e => updateRow(p.id, 'residualValue', parseFloat(e.target.value) || 0)} className={dCls + ' num text-right'}/></td>
                      </>
                    ) : (
                      <>
                        <td className="py-2 px-2 text-slate-200 font-medium">{p.distributor}</td>
                        <td className="py-2 px-2 text-slate-300 text-xs">{p.assetType}</td>
                        <td className="py-2 px-2 text-slate-300">{p.productName}</td>
                        <td className="py-2 px-2 num text-right text-slate-400">{p.durationMonths}m</td>
                        <td className="py-2 px-2 num text-right text-slate-200">{fmtEur(p.priceCAPEX)}</td>
                        <td className="py-2 px-2 num text-right text-mint-400">{p.installment.toFixed(2)} €</td>
                        <td className="py-2 px-2 num text-right text-slate-400">{p.residualValue.toFixed(2)} €</td>
                      </>
                    )}
                    <td className="py-2 px-2 num text-right text-xs font-semibold">
                      <span className={irr != null ? (irr > 0 ? 'text-mint-300' : 'text-red-400') : 'text-slate-600'}>
                        {irr != null && isFinite(irr) ? (irr*100).toFixed(2) + '%' : '—'}
                      </span>
                    </td>
                    <td className="py-2 px-2 text-right">
                      <div className="flex items-center justify-end gap-1">
                        <button onClick={() => setEditingId(editing ? null : p.id)} className="text-[10px] px-2 py-1 rounded border border-ink-700 hover:border-mint-500 hover:text-mint-400 text-slate-400 transition">
                          {editing ? 'Done' : 'Edit'}
                        </button>
                        <button onClick={() => deleteRow(p.id)} className="text-red-400/70 hover:text-red-400 px-1.5 py-1">{I.trash}</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
              {filtered.length === 0 && (
                <tr><td colSpan="9" className="py-8 text-center text-sm text-slate-500 italic">No entries match the filters.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

/* =====================================================================
   TOAST
   ===================================================================== */
function Toast({ toast }) {
  if (!toast) return null;
  const styles = {
    success: 'bg-mint-500/10 border-mint-500/40 text-mint-300',
    error: 'bg-red-500/10 border-red-500/40 text-red-300',
    info: 'bg-ink-700 border-ink-600 text-slate-200',
  };
  return (
    <div className="fixed bottom-6 right-6 z-50 animate-in fade-in slide-in-from-bottom-2">
      <div className={"px-4 py-3 border rounded-md shadow-2xl backdrop-blur " + (styles[toast.type] || styles.info)}>
        <div className="flex items-center gap-2 text-sm">
          {toast.type === 'success' && I.check}
          {toast.type === 'error' && I.alert}
          {toast.type === 'info' && I.info}
          <span>{toast.msg}</span>
        </div>
      </div>
    </div>
  );
}

/* =====================================================================
   APP ROOT
   ===================================================================== */
function App() {
  const [view, setView] = useState('dashboard');
  const [criteria, setCriteriaRaw] = useState(DEFAULT_CRITERIA);
  const [loanbook, setLoanbookRaw] = useState([]);
  const [partners, setPartnersRaw] = useState([]);
  const [pricing, setPricingRaw] = useState(PRICING_SEED);
  const [apiConfig, setApiConfigRaw] = useState(DEFAULT_API_CONFIG);
  const [financials, setFinancials] = useState(EMPTY_FINANCIALS);
  const [toast, setToast] = useState(null);
  const [booted, setBooted] = useState(false);

  // Load persisted state
  useEffect(() => {
    (async () => {
      const c = await storageGet('tecfys:criteria', null);
      if (c) {
        // Migration: stored criteria from an older version may lack per-ratio scoreTable.
        // Backfill it from DEFAULT_CRITERIA so the new normalised scoring works on saved configs.
        const migrated = { ...c };
        if (c.ratios) {
          migrated.ratios = { ...c.ratios };
          for (const key of Object.keys(DEFAULT_CRITERIA.ratios)) {
            const userRatio = c.ratios[key] || {};
            const defRatio = DEFAULT_CRITERIA.ratios[key];
            migrated.ratios[key] = {
              ...defRatio,
              ...userRatio,
              scoreTable: userRatio.scoreTable || defRatio.scoreTable,
            };
          }
        }
        setCriteriaRaw(migrated);
      }
      const lb = await storageGet('tecfys:loanbook', []);
      setLoanbookRaw(lb);
      const p = await storageGet('tecfys:partners', []);
      setPartnersRaw(p);
      const stored = await storageGet('tecfys:pricing', null);
      if (stored && Array.isArray(stored) && stored.length > 0) setPricingRaw(stored);
      const cfg = await storageGet('tecfys:api_config', null);
      if (cfg) setApiConfigRaw({ ...DEFAULT_API_CONFIG, ...cfg });
      setBooted(true);
    })();
  }, []);

  const setCriteria = (updater) => {
    setCriteriaRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      storageSet('tecfys:criteria', next);
      return next;
    });
  };
  const setPricing = (updater) => {
    setPricingRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      storageSet('tecfys:pricing', next);
      return next;
    });
  };
  const setApiConfig = (updater) => {
    setApiConfigRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      storageSet('tecfys:api_config', next);
      return next;
    });
  };
  const registerLoan = async (op) => {
    const next = [...loanbook, op];
    setLoanbookRaw(next);
    await storageSet('tecfys:loanbook', next);
  };
  const deleteLoan = async (id) => {
    const next = loanbook.filter(l => l.id !== id);
    setLoanbookRaw(next);
    await storageSet('tecfys:loanbook', next);
    pushToast('Operation deleted.', 'info');
  };
  const addPartner = async (name) => {
    if (!name || partners.includes(name)) return;
    const next = [...partners, name].sort((a,b) => a.localeCompare(b));
    setPartnersRaw(next);
    await storageSet('tecfys:partners', next);
  };
  const pushToast = (msg, type = 'info') => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3500);
  };

  if (!booted) {
    return <div className="min-h-screen flex items-center justify-center"><span className="w-6 h-6 border-2 border-mint-500 border-t-transparent rounded-full animate-spin"/></div>;
  }

  return (
    <div className="min-h-screen flex">
      <Sidebar view={view} setView={setView}/>
      <main className="flex-1 overflow-auto">
        <div className="gridlines min-h-screen">
          <div className="max-w-[1400px] mx-auto px-8 py-8">
            {view === 'dashboard' && <Dashboard loanbook={loanbook} setView={setView}/>}
            {view === 'new'       && <NewScoring criteria={criteria} financials={financials} setFinancials={setFinancials} registerLoan={registerLoan} setView={setView} pushToast={pushToast} partners={partners} addPartner={addPartner} pricing={pricing}/>}
            {view === 'cif'       && <CifLookup criteria={criteria} setFinancials={setFinancials} setView={setView} pushToast={pushToast} apiConfig={apiConfig} setApiConfig={setApiConfig}/>}
            {view === 'pdf'       && <PdfDrop criteria={criteria} setFinancials={setFinancials} setView={setView} pushToast={pushToast}/>}
            {view === 'loanbook'  && <LoanBook loanbook={loanbook} deleteLoan={deleteLoan} setView={setView} pushToast={pushToast} criteria={criteria} registerLoan={registerLoan}/>}
            {view === 'pricing'   && <PricingEditor pricing={pricing} setPricing={setPricing} pushToast={pushToast}/>}
            {view === 'criteria'  && <CriteriaEditor criteria={criteria} setCriteria={setCriteria} pushToast={pushToast}/>}
          </div>
        </div>
      </main>
      <Toast toast={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
