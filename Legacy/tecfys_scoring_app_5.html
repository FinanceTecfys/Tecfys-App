/* =====================================================================
   SCORING ENGINE
   ===================================================================== */
function ratingForRatio(value, ratio) {
  if (value === null || value === undefined || isNaN(value)) return 'C';
  if (ratio.direction === 'higher') {
    for (const [r, t] of ratio.tiers) if (value >= t) return r;
    return 'C';
  }
  if (ratio.direction === 'lower') {
    for (const [r, t] of ratio.tiers) if (value <= t) return r;
    return 'C';
  }
  return 'C';
}

function ratingFromScore(score, buckets) {
  if (score === null || isNaN(score)) return 'C';
  for (const [r, lower] of buckets) {
    if (score >= lower) return r;
  }
  return 'C';
}

function computeRatios(f) {
  const totalLiab = (f.nonCurrentLiabilities||0) + (f.currentLiabilities||0);
  const totalAssets = (f.nonCurrentAssets||0) + (f.currentAssets||0);
  const procurement = f.procurement || (f.totalRevenue ? f.totalRevenue - (f.grossMargin||0) : 0);
  return {
    guarantee:        totalLiab > 0 ? totalAssets / totalLiab : null,
    solvency:         f.currentLiabilities > 0 ? f.currentAssets / f.currentLiabilities : null,
    indebtedness:     f.equity > 0 ? totalLiab / f.equity : null,
    netMargin:        f.totalRevenue > 0 && f.netResult != null ? f.netResult / f.totalRevenue : null,
    maturity:         f.maturityYears != null ? f.maturityYears : null,
    economicProfit:   totalAssets > 0 && f.netResult != null ? f.netResult / totalAssets : null,
    financialProfit:  f.equity > 0 && f.netResult != null ? f.netResult / f.equity : null,
    paymentPeriod:    procurement > 0 && f.payables != null ? (f.payables / procurement) * 365 : null,
    collectionPeriod: f.totalRevenue > 0 && f.receivables != null ? (f.receivables / f.totalRevenue) * 365 : null,
  };
}

function score(financials, criteria) {
  const ratios = computeRatios(financials);
  const breakdown = {};
  let total = 0;

  Object.entries(criteria.ratios).forEach(([key, def]) => {
    const weight = criteria.weights[key] || 0;
    let rat;
    let value;
    if (key === 'sectorialRisk') {
      rat = criteria.sectorRating[financials.sector] || 'BBB';
      value = financials.sector || '—';
    } else {
      value = ratios[key];
      rat = ratingForRatio(value, def);
    }
    // Per-ratio normalised score (1-10) — each ratio has its own scoring scale.
    // Fallback chain: ratio's own scoreTable → legacy global ratingScores → 1.
    const ratingScore = (def.scoreTable && def.scoreTable[rat] != null)
      ? def.scoreTable[rat]
      : (criteria.ratingScores ? (criteria.ratingScores[rat] ?? 1) : 1);
    const contribution = ratingScore * weight;
    total += contribution;
    breakdown[key] = { value, rating: rat, ratingScore, weight, contribution, label: def.label, formula: def.formula };
  });

  const finalRating = ratingFromScore(total, criteria.scoreBuckets);
  const prudence = criteria.prudence[finalRating] ?? 0.10;
  const adjustedEbitda = financials.adjustedEbitda != null ? financials.adjustedEbitda : (financials.ebitda || 0);
  const creditOpinion = Math.max(0, adjustedEbitda * prudence);
  const decision = criteria.decisionRules[finalRating] || 'reject';

  return { ratios, breakdown, totalScore: total, finalRating, prudence, adjustedEbitda, creditOpinion, decision };
}

/* =====================================================================
   INFORMA PDF PARSER
   Parses standard INFORMA D&B reports (NICTON-like structure)
   ===================================================================== */
async function parseInformaPdf(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let allText = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const pageText = content.items.map(it => it.str).join(' ');
    allText += '\n\n=== PAGE ' + i + ' ===\n' + pageText;
  }

  // Helpers
  const N = (s) => {
    if (!s) return null;
    s = s.replace(/\./g, '').replace(',', '.').replace(/[€\s]/g, '');
    const v = parseFloat(s);
    return isNaN(v) ? null : v;
  };
  const grab = (re, src=allText) => { const m = src.match(re); return m ? m[1] : null; };

  // Identification
  const name = grab(/Informa Comercial\s+([A-ZÁÉÍÓÚÑ0-9 ,.\-&]+SL\.?|[A-ZÁÉÍÓÚÑ0-9 ,.\-&]+S\.A\.?)/) || grab(/^([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ0-9 .,&\-]+(SL|S\.L|S\.A|SA))\.?/m);
  const cif = grab(/NIF\s+([A-Z][0-9]{8})/);
  const address = grab(/DOMICILIO SOCIAL\s+([^\n]+?)\s+\d{5}\s+/);
  const cnae = grab(/CNAE 2009\)\s+(\d{4})/) || grab(/CNAE 2009:\s+(\d{4})/) || grab(/ACTIVIDAD CNAE\s+(?:CNAE 2009:\s+)?(\d{4})/);
  const phones = grab(/TELÉFONOS\s+(\d+)/);
  const web = grab(/PÁGINA WEB\s+(\S+)/);
  const email = grab(/EMAIL CORPORATIVO\s+(\S+@\S+)/);
  const constitutionDate = grab(/FECHA DE CONSTITUCIÓN\s+(\d{2}\/\d{2}\/\d{4})/);
  const employees = N(grab(/EMPLEADOS\s+(\d+)/));
  const adminName = grab(/ADMINISTRADOR ÚNICO\s+([A-ZÁÉÍÓÚÑ ,]+?)\s+(?:Estructura|ACCIONISTA|Cargo)/);

  // Informa scoring (label changed from "RATING INFORMA" to "NOTA INFORMA" in recent reports)
  const informaRating = grab(/(?:RATING INFORMA|NOTA INFORMA)\s+(\d+\/\d+)/);
  const creditOpinionInforma = N(grab(/OPINIÓN DE CRÉDITO\s+([\d.,]+)\s*€/));
  const scoreLiquidez = grab(/SCORE LIQUIDEZ\s+(\d+\/\d+)/);
  const resilience = grab(/RESILIENCIA\s+(\d+\/\d+)/);

  // Reference year (most recent FY shown in the report — always the leftmost column)
  const referenceYear = grab(/VENTAS BALANCE\s+\((\d{4})\)/) || grab(/ACTIVO TOTAL\s+\((\d{4})\)/) || grab(/DEPÓSITO INDIVIDUAL\s+(\d{4})/);

  // Executive summary fallbacks (rounded euros, used only if detailed P&L parsing fails)
  let totalRevenue = N(grab(/VENTAS BALANCE.*?([\d.,]+)\s*€\s*\(Registro/));
  let netResult    = N(grab(/RESULTADOS BALANCE.*?(-?[\d.,]+)\s*€\s*\(Registro/));
  const totalAssets  = N(grab(/ACTIVO TOTAL.*?([\d.,]+)\s*€/));
  const shareCapital = N(grab(/CAPITAL SOCIAL\s+([\d.,]+)\s*€/));

  // === Balance Sheet — row-aligned extraction ===
  // Each row has yearCount × 2 numbers (value + % per year). Latest year = leftmost column = index 0 of each row.
  // Rows in order: NCA, CA, Equity, NCL, CL → indices [0], [stride], [2·stride], [3·stride], [4·stride]
  let nonCurrentAssets = null, currentAssets = null, equity = null, ncLiab = null, cLiab = null;
  const balanceMatch = allText.match(/Análisis del Balance([\s\S]{0,2500}?)(?=Balance Activo|Balance Pasivo|Comentarios del Balance|Datos financieros|$)/);
  if (balanceMatch) {
    const section = balanceMatch[1];
    const yearHeaders = (section.match(/31\/12\/\d{4}/g) || []).length;
    const yearCount = Math.max(1, Math.min(5, yearHeaders || 3));
    // Capture signed numbers — negatives appear in distressed equity/liabilities
    const nums = [...section.matchAll(/(-?[\d]{1,3}(?:\.\d{3})*,\d{2})/g)].map(m => N(m[1]));
    const stride = yearCount * 2;
    if (nums.length >= 5 * stride) {
      nonCurrentAssets = nums[0];
      currentAssets    = nums[stride];
      equity           = nums[2 * stride];
      ncLiab           = nums[3 * stride];
      cLiab            = nums[4 * stride];
    }
  }

  // === P&L — row-aligned extraction ===
  // Ventas row has yearCount values (no %). Margen/EBITDA/EBIT/Net rows have yearCount × 2 (value + %). Tax row yearCount values.
  // Latest year positions: Ventas=0, Margen=yearCount, EBITDA=3·yearCount, EBIT=5·yearCount, Net=7·yearCount
  let grossMargin = null, ebitda = null, ebit = null;
  const plMatch = allText.match(/Análisis de la Cuenta de Pérdidas y Ganancias([\s\S]{0,3000}?)(?=Comentarios de la Cuenta|Distribución de resultados|Datos financieros|Comparativa Sectorial|$)/);
  if (plMatch) {
    const section = plMatch[1];
    const yearHeaders = (section.match(/31\/12\/\d{4}/g) || []).length;
    const yearCount = Math.max(1, Math.min(5, yearHeaders || 3));
    const nums = [...section.matchAll(/(-?[\d]{1,3}(?:\.\d{3})*,\d{2})/g)].map(m => N(m[1]));
    if (nums.length >= 7 * yearCount + 1) {
      const revenuePL = nums[0];
      grossMargin     = nums[yearCount];
      ebitda          = nums[3 * yearCount];
      ebit            = nums[5 * yearCount];
      const netPL     = nums[7 * yearCount];
      // Detailed P&L values have cent precision — prefer over rounded executive summary
      if (revenuePL != null) totalRevenue = revenuePL;
      if (netPL != null)     netResult    = netPL;
    }
  }

  // Payment period (días) — direct extraction from "Pagos a Proveedores" section
  const paymentPeriodDays = N(grab(/Periodo medio de pago a proveedores\s+(\d+)/));

  // Sector inference from CNAE
  const sector = cnaeToSector(cnae);

  // Maturity (years since constitution)
  let maturityYears = null;
  if (constitutionDate) {
    const [d,m,y] = constitutionDate.split('/').map(Number);
    const founded = new Date(y, m-1, d);
    maturityYears = Math.floor((Date.now() - founded.getTime()) / (365.25 * 24 * 3600 * 1000));
  }

  return {
    raw: allText.length,
    name: name ? name.trim() : null,
    cif,
    address: address ? address.trim() : null,
    cnae,
    sector,
    phones,
    web,
    email,
    constitutionDate,
    maturityYears,
    employees,
    adminName: adminName ? adminName.trim() : null,
    informaRating,
    creditOpinionInforma,
    scoreLiquidez,
    resilience,
    totalRevenue,
    netResult,
    totalAssets,
    shareCapital,
    nonCurrentAssets,
    currentAssets,
    equity,
    nonCurrentLiabilities: ncLiab,
    currentLiabilities: cLiab,
    grossMargin,
    ebitda,
    ebit,
    paymentPeriodDays,
    referenceYear,
    // adjusted EBITDA defaults to EBITDA — user can override
    adjustedEbitda: ebitda,
  };
}

/* =====================================================================
   INFORMA D&B — LIVE API ADAPTER
   The Tecfys app cannot call api.informa.es directly from the browser:
   the endpoint requires HTTP Basic auth (user/pass) which would be
   exposed in client-side JS, and Informa does not enable arbitrary CORS.

   Architecture used here:
     Tecfys app  →  Tecfys API proxy  →  Informa REST API
                    └ holds credentials in env vars
                    └ adds CORS for the Tecfys frontend origin
                    └ optionally caches responses (Informa charges per call)

   The proxy contract this app expects (see API Settings panel for full doc):

     GET  {proxyUrl}/health
       Returns { status:'ok', mode:'live'|'mock', informaUser?:'<masked>' }

     GET  {proxyUrl}/informa/company/{cif}
       Headers: X-API-Key: <user-key>
       Returns the raw Informa JSON envelope
       Errors:  404 if CIF unknown · 502 on upstream failure · 401 on bad key

   The proxy can target whichever Informa product (Summarized, Credit,
   Financial Report). The normalizer below pulls fields defensively
   from common locations in the schema documented by the Informa
   API Empresas corporate manual.
   ===================================================================== */
const INFORMA_ERRORS = {
  10000: 'Informa: connection to the commercial management system failed.',
  10001: 'Informa: invalid credentials (the proxy could not authenticate).',
  10002: 'Informa: the configured user does not have permission for this product.',
  10003: 'Informa: the configured password has expired and must be renewed.',
  11000: 'Informa: the data source is temporarily unavailable.',
  11001: 'Informa: the requested product is not available for this CIF.',
  11002: 'Informa: the CIF does not meet the minimum required data quality.',
  11003: 'CIF not found in the Informa census.',
  11005: 'Informa: this company is temporarily blocked while data is being updated.',
  12000: 'Informa: the request is missing required parameters.',
  12001: 'Informa: internal server error.',
};

function buildAddressFromInforma(loc) {
  if (!loc) return null;
  const parts = [loc.direccion, loc.codigoPostal, loc.localidad || loc.poblacion, loc.provincia].filter(Boolean);
  return parts.length ? parts.join(', ') : null;
}
function computeMaturityFromDate(dateStr) {
  if (!dateStr) return null;
  let y;
  const mDmy = String(dateStr).match(/(\d{2})\/(\d{2})\/(\d{4})/);
  const mYmd = String(dateStr).match(/(\d{4})-(\d{2})-(\d{2})/);
  if (mDmy) y = parseInt(mDmy[3]);
  else if (mYmd) y = parseInt(mYmd[1]);
  else return null;
  return new Date().getFullYear() - y;
}

/**
 * Map Informa's nested coded JSON → flat financials object used by the scoring engine.
 * Defensive on field names: the exact schema varies by Informa product version.
 */
function normalizeInformaResponse(json) {
  const dp   = json?.datosProducto || {};
  const ic   = dp.informacionComercial || {};
  const id   = ic.identificacion || {};
  const loc  = ic.localizacion || ic.domicilio || {};
  const act  = ic.actividad || {};
  const fin  = dp.informacionFinanciera || dp.informacionEconomica || {};
  const risk = dp.informacionRiesgo || dp.indicadoresRiesgo || dp.posicionamientoRiesgo || {};

  // Always pick the latest reported FY
  const balanceList = Array.isArray(fin.balances) ? fin.balances : (Array.isArray(fin.listaBalances) ? fin.listaBalances : (fin.balance ? [fin.balance] : []));
  const pnlList     = Array.isArray(fin.cuentasResultados) ? fin.cuentasResultados : (Array.isArray(fin.listaCuentasResultados) ? fin.listaCuentasResultados : (fin.cuentaResultados ? [fin.cuentaResultados] : []));
  const byYearDesc  = (a, b) => (b.ejercicio || b.anio || b.year || 0) - (a.ejercicio || a.anio || a.year || 0);
  const bal = balanceList.slice().sort(byYearDesc)[0] || {};
  const pl  = pnlList.slice().sort(byYearDesc)[0] || {};

  const cnae = act.cnae?.codigo || act.codigoCnae || act.cnae2009?.codigo || act.codigoActividad;
  const constitutionDate = id.fechaConstitucion || ic.fechaConstitucion || dp.fechaConstitucion;

  const notaInforma    = risk.notaInforma ?? risk.scoreCese ?? null;
  const scoreLiq       = risk.scoreLiquidez ?? null;
  const resiliencia    = risk.indiceResiliencia ?? risk.resiliencia ?? null;
  const opinionCredito = (risk.opinionCredito && typeof risk.opinionCredito === 'object')
    ? (risk.opinionCredito.importe ?? risk.opinionCredito.valor)
    : risk.opinionCredito;

  const admins = ic.organoAdministracion?.administradores || ic.administradores || dp.administradores || [];
  const firstAdmin = admins.find(a => a?.vigente !== false) || admins[0];
  const adminName = firstAdmin?.nombreApellidos || firstAdmin?.denominacion || null;

  return {
    cif:               id.cif || id.nif,
    name:              id.denominacionActual || id.denominacion || id.razonSocial,
    address:           buildAddressFromInforma(loc),
    cnae,
    sector:            cnaeToSector(cnae),
    phones:            id.listaTelefonos?.[0] || id.telefono,
    email:             id.email,
    web:               id.listaUrls?.[0] || id.web,
    constitutionDate,
    maturityYears:     computeMaturityFromDate(constitutionDate),
    employees:         ic.tamano?.empleados ?? ic.empleados ?? dp.empleados ?? null,
    adminName,

    informaRating:        notaInforma != null ? `${notaInforma}/20` : null,
    creditOpinionInforma: opinionCredito != null ? Number(opinionCredito) : null,
    scoreLiquidez:        scoreLiq != null ? `${scoreLiq}/100` : null,
    resilience:           resiliencia != null ? `${resiliencia}/100` : null,

    totalRevenue:      pl.importeNetoCifraNegocios ?? pl.ventas ?? pl.cifraVentas ?? null,
    grossMargin:       pl.margenBruto ?? null,
    ebitda:            pl.ebitda ?? null,
    ebit:              pl.ebit ?? pl.resultadoExplotacion ?? null,
    netResult:         pl.resultadoNeto ?? pl.resultadoEjercicio ?? null,
    financialExpenses: pl.gastosFinancieros ?? pl.resultadoFinanciero ?? null,

    totalAssets:           bal.totalActivo ?? bal.activoTotal ?? null,
    nonCurrentAssets:      bal.activoNoCorriente ?? bal.activoFijo ?? null,
    currentAssets:         bal.activoCorriente ?? bal.activoCirculante ?? null,
    equity:                bal.patrimonioNeto ?? bal.fondosPropios ?? null,
    nonCurrentLiabilities: bal.pasivoNoCorriente ?? bal.pasivoFijo ?? null,
    currentLiabilities:    bal.pasivoCorriente ?? bal.pasivoCirculante ?? null,
    shareCapital:          id.capitalSocial ?? ic.capitalSocial ?? null,

    receivables:       bal.clientesComerciales ?? bal.deudoresComerciales ?? null,
    payables:          bal.acreedoresComerciales ?? bal.proveedores ?? null,
    procurement:       pl.consumos ?? pl.aprovisionamientos ?? null,

    referenceYear:     bal.ejercicio ?? bal.anio ?? pl.ejercicio ?? pl.anio ?? null,
    paymentPeriodDays: ic.periodoMedioPagoProveedores ?? null,
    country:           'ES',
    adjustedEbitda:    pl.ebitda ?? null,

    amount: null, durationMonths: null, intervalPayment: null, paymentFrequency: 'monthly',
    distributor: '', assetType: '', productName: '', assetValue: null, residualValue: null,
    partner: '', irr: null,

    _source: 'live-informa-api',
  };
}

/** Live lookup against the Tecfys proxy. Throws on any failure with a clean message. */
async function informaLookupLive(cif, config) {
  if (!config?.proxyUrl) throw new Error('Live API not configured — set the proxy URL in API settings.');
  const baseUrl = config.proxyUrl.replace(/\/+$/, '');
  const headers = { 'Accept': 'application/json' };
  if (config.apiKey) headers['X-API-Key'] = config.apiKey;
  let res;
  try {
    res = await fetch(`${baseUrl}/informa/company/${encodeURIComponent(cif)}`, { headers });
  } catch (e) {
    throw new Error(`Network error reaching the proxy at ${baseUrl}. Check the URL and CORS for this origin.`);
  }
  if (res.status === 401) throw new Error('Proxy rejected the X-API-Key — check the value in API settings.');
  if (res.status === 404) throw new Error(INFORMA_ERRORS[11003]);
  if (res.status === 502 || res.status === 503) throw new Error('Upstream Informa API is unreachable through the proxy.');
  if (!res.ok) {
    const body = await res.text().catch(() => '');
    throw new Error(`Proxy returned HTTP ${res.status}. ${body.slice(0, 200)}`);
  }
  const json = await res.json();
  const informaCode = json?.campoCodificadoRespuesta?.valor;
  if (informaCode != null && informaCode !== 0) {
    throw new Error(INFORMA_ERRORS[informaCode] || `Informa returned error code ${informaCode}.`);
  }
  const normalized = normalizeInformaResponse(json);
  if (!normalized.cif && !normalized.name) {
    throw new Error('The proxy responded but the payload could not be normalized — verify the proxy maps Informa\'s schema correctly.');
  }
  return normalized;
}

/** Hit /health on the proxy and return diagnostic info, or throw a clean error. */
async function informaTestConnection(config) {
  if (!config?.proxyUrl) throw new Error('Set the proxy URL first.');
  const baseUrl = config.proxyUrl.replace(/\/+$/, '');
  const headers = { 'Accept': 'application/json' };
  if (config.apiKey) headers['X-API-Key'] = config.apiKey;
  const t0 = performance.now();
  let res;
  try {
    res = await fetch(`${baseUrl}/health`, { headers });
  } catch (e) {
    throw new Error('Could not reach the proxy. Verify the URL and that CORS is enabled for this origin.');
  }
  if (!res.ok) throw new Error(`Health check failed with HTTP ${res.status}.`);
  const body = await res.json().catch(() => ({}));
  return { ok: true, mode: body.mode || 'live', latencyMs: Math.round(performance.now() - t0), payload: body };
}

/** Public entry point used by CifLookup. Routes to live API or mock based on config. */
async function informaLookup(cif, config) {
  if (config?.useLive && config?.proxyUrl) {
    return await informaLookupLive(cif, config);
  }
  return await mockInformaApi(cif);
}

    loanbook.forEach(l => { countries[l.country || 'Other'] = (countries[l.country || 'Other'] || 0) + (l.amount || 0); });
    const buckets = SIZE_BUCKETS.map(b => {
      const items = loanbook.filter(l => (l.amount || 0) >= b.min && (l.amount || 0) < b.max);
      return { ...b, count: items.length, amount: items.reduce((s,l) => s + (l.amount || 0), 0) };
    });
    return { total, exposure, avgIrr, dist, sectors, countries, buckets };
  }, [loanbook]);

  const maxDist = Math.max(1, ...Object.values(stats.dist));
  const sectorList = Object.entries(stats.sectors).sort((a,b) => b[1]-a[1]).slice(0,6);
  const maxSector = sectorList[0]?.[1] || 1;
  const countryList = Object.entries(stats.countries).sort((a,b) => b[1]-a[1]).slice(0,6);

  const maxBucket = Math.max(1, ...stats.buckets.map(b => b.amount));

        <Card>

        <Card>

        <Card>

              return (

        )}
      </Card>

      <Card title="Recent operations" action={
        <button onClick={() => setView('loanbook')} className="text-xs text-mint-400 hover:text-mint-300 font-semibold uppercase tracking-wider flex items-center gap-1">View loan book {I.chev}</button>

                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Card>
    </div>
  );
}

/* =====================================================================
   IRR CALCULATION
   Cash flow structure (matches the Excel "Workings" sheet):
     t=0:       -CAPEX (Tecfys's outflow to buy the asset)
     t=1..N:    +installment (periodic income)
     t=N+1:     +residualValue (final balloon income, separate cash flow)
   This is "Approach C" — verified to match Excel IRR of 12.7062%
   for the Dish washer 24-month reference row.
   ===================================================================== */
function calcPeriodIRR(cashFlows, guess = 0.01) {
  if (!cashFlows || cashFlows.length < 2) return null;
  let r = guess;
  for (let i = 0; i < 200; i++) {
    let npv = 0, dnpv = 0;
    for (let t = 0; t < cashFlows.length; t++) {
      const pow = Math.pow(1 + r, t);
      npv += cashFlows[t] / pow;
      if (t > 0) dnpv -= t * cashFlows[t] / (pow * (1 + r));
    }
    if (Math.abs(npv) < 1e-10) return r;
    if (dnpv === 0 || !isFinite(dnpv)) return null;
    const step = npv / dnpv;
    r = r - step;
    if (r <= -0.99) r = -0.5;        // bounce from invalid territory
    if (!isFinite(r)) return null;
    if (Math.abs(step) < 1e-12) return r;
  }
  return r;
}

/* Build the periodic cash-flow vector for a leasing operation. */
function buildLeasingCashFlows(capex, installment, residual, periods) {
  if (!(capex > 0) || !(installment > 0) || !(periods > 0)) return null;
  const cf = [-Math.abs(capex)];
  for (let t = 0; t < periods; t++) cf.push(installment);
  cf.push(residual || 0);
  return cf;
}

/* Compute annualized target IRR — formula: (1 + monthlyIRR)^12 - 1 (or quarterly variant) */
function computeTargetIRR({ assetValue, intervalPayment, residualValue, durationMonths, paymentFrequency }) {
  if (!assetValue || !intervalPayment || !durationMonths) return null;
  const periodsPerYear = paymentFrequency === 'quarterly' ? 4 : 12;
  const periods = paymentFrequency === 'quarterly' ? Math.floor(durationMonths / 3) : durationMonths;
  if (periods <= 0) return null;
  const cf = buildLeasingCashFlows(assetValue, intervalPayment, residualValue || 0, periods);
  if (!cf) return null;
  const periodIRR = calcPeriodIRR(cf, 0.01);
  if (periodIRR == null || !isFinite(periodIRR)) return null;
  return Math.pow(1 + periodIRR, periodsPerYear) - 1;
}

/* ---------- PricingPicker: 4 cascading dropdowns that autofill CAPEX/installment/residual ---------- */
function PricingPicker({ pricing, financials, setFinancials }) {
  // Suggestions filter progressively but never block manual typing.
  const distributors = useMemo(() => [...new Set(pricing.map(p => p.distributor))].sort(), [pricing]);
  const assetTypes = useMemo(() => {
    const src = financials.distributor
      ? pricing.filter(p => p.distributor === financials.distributor)
      : pricing;
    return [...new Set(src.map(p => p.assetType))].sort();
  }, [pricing, financials.distributor]);
  const productNames = useMemo(() => {
    const src = pricing.filter(p =>
      (!financials.distributor || p.distributor === financials.distributor) &&
      (!financials.assetType   || p.assetType   === financials.assetType)
    );
    return [...new Set(src.map(p => p.productName))].sort();
  }, [pricing, financials.distributor, financials.assetType]);
  const durations = useMemo(() => {
    const src = pricing.filter(p =>
      (!financials.distributor || p.distributor === financials.distributor) &&
      (!financials.assetType   || p.assetType   === financials.assetType) &&
      (!financials.productName || p.productName === financials.productName)
    );
    return [...new Set(src.map(p => p.durationMonths))].sort((a,b) => a - b);
  }, [pricing, financials.distributor, financials.assetType, financials.productName]);

  // When any of the four selectors changes, look for a full catalog match and autofill CAPEX/installment/residual.
  const tryAutofill = (next) => {
    const merged = { ...financials, ...next };
    const match = pricing.find(p =>
      p.distributor    === merged.distributor &&
      p.assetType      === merged.assetType &&
      p.productName    === merged.productName &&
      p.durationMonths === parseInt(merged.durationMonths)
    );
    if (match) {
      setFinancials(prev => ({
        ...prev,
        ...next,
        durationMonths: match.durationMonths,
        assetValue:     match.priceCAPEX,
        intervalPayment: match.installment,
        residualValue:  match.residualValue,
        amount:         match.priceCAPEX,
      }));
    } else {
      setFinancials(prev => ({ ...prev, ...next }));
    }
  };

  const setDistributor = (v) => tryAutofill({ distributor: v });
  const setAssetType   = (v) => tryAutofill({ assetType: v });
  const setProductName = (v) => tryAutofill({ productName: v });
  const setDuration    = (v) => tryAutofill({ durationMonths: v === '' ? null : (parseInt(v) || null) });

  const matched = pricing.find(p =>
    p.distributor    === financials.distributor &&
    p.assetType      === financials.assetType &&
    p.productName    === financials.productName &&
    p.durationMonths === parseInt(financials.durationMonths)
  );

  const cls = "w-full bg-ink-900/70 border border-mint-500/20 rounded-md px-3 py-2 text-sm text-slate-100 focus:border-mint-500 transition";

  return (
    <div className="mb-4 p-3 bg-mint-500/[0.04] border border-mint-500/15 rounded-md">
      <div className="flex items-center justify-between mb-2">
        <div className="text-[10px] uppercase tracking-[0.18em] text-mint-400 font-semibold flex items-center gap-2">
          Pricing catalog
          {matched && <span className="text-[9px] px-1.5 py-0.5 rounded bg-mint-500/15 border border-mint-500/30 tracking-wider">Autofilled</span>}
        </div>
        <div className="text-[10px] text-slate-500">Pick from catalog or type any value manually · CAPEX/installment/residual auto-fill on full match</div>
      </div>
      <div className="grid grid-cols-4 gap-2">
        <div>
          <span className="block text-[10px] uppercase tracking-[0.12em] text-slate-400 mb-1">Distributor</span>
          <input type="text" list="pp-distributors" value={financials.distributor || ''} placeholder="e.g. NICTON PLUS"
            onChange={e => setDistributor(e.target.value)} className={cls}/>
          <datalist id="pp-distributors">{distributors.map(d => <option key={d} value={d}/>)}</datalist>
        </div>
        <div>
          <span className="block text-[10px] uppercase tracking-[0.12em] text-slate-400 mb-1">Asset type</span>
          <input type="text" list="pp-assettypes" value={financials.assetType || ''} placeholder="e.g. Laptops"
            onChange={e => setAssetType(e.target.value)} className={cls}/>
          <datalist id="pp-assettypes">{assetTypes.map(a => <option key={a} value={a}/>)}</datalist>
        </div>
        <div>
          <span className="block text-[10px] uppercase tracking-[0.12em] text-slate-400 mb-1">Product</span>
          <input type="text" list="pp-products" value={financials.productName || ''} placeholder="e.g. ASUS"
            onChange={e => setProductName(e.target.value)} className={cls}/>
          <datalist id="pp-products">{productNames.map(p => <option key={p} value={p}/>)}</datalist>
        </div>
        <div>
          <span className="block text-[10px] uppercase tracking-[0.12em] text-slate-400 mb-1">Duration (months)</span>
          <input type="number" list="pp-durations" value={financials.durationMonths ?? ''} placeholder="e.g. 24"
            onChange={e => setDuration(e.target.value)} className={cls + ' num'}/>
          <datalist id="pp-durations">{durations.map(d => <option key={d} value={d}/>)}</datalist>
        </div>
      </div>
    </div>
  );
}

/* ---------- ComputedIRRField: read-only annualized IRR from cash flows ---------- */
function ComputedIRRField({ financials }) {
  const irr = useMemo(() => computeTargetIRR({
    assetValue: financials.assetValue,
    intervalPayment: financials.intervalPayment,
    residualValue: financials.residualValue,
    durationMonths: financials.durationMonths,
    paymentFrequency: financials.paymentFrequency,
  }), [financials.assetValue, financials.intervalPayment, financials.residualValue, financials.durationMonths, financials.paymentFrequency]);

  const ready = irr != null && isFinite(irr);
  const isPositive = ready && irr > 0;
  return (
    <div>
      <div className="flex items-center justify-between mb-1.5">
        <span className="text-[11px] uppercase tracking-[0.14em] text-slate-400">Target IRR (auto)</span>
        <span className="text-[9px] text-mint-500/70 uppercase tracking-wider">{financials.paymentFrequency === 'quarterly' ? '(1+q)^4–1' : '(1+m)^12–1'}</span>
      </div>
      <div className={"w-full bg-ink-900 border rounded-md px-3 py-2 text-sm num font-bold tabular-nums tracking-tight " +
        (ready ? (isPositive ? 'border-mint-500/40 text-mint-300' : 'border-red-500/40 text-red-300') : 'border-ink-700 text-slate-600')}>
        {ready ? (irr * 100).toFixed(4) + ' %' : '— enter CAPEX, installment & duration'}
      </div>
      {ready && (
        <div className="text-[10px] text-slate-500 mt-1 num">
          Cash flow: −{Math.round(financials.assetValue).toLocaleString()} · {financials.intervalPayment?.toFixed(2)}×{financials.paymentFrequency === 'quarterly' ? Math.floor(financials.durationMonths/3) : financials.durationMonths} · +{Math.round(financials.residualValue || 0).toLocaleString()}
        </div>
      )}
    </div>
  );
}

→ 200 OK
{ "status": "ok",
  "mode": "live" }`}</code>
          </div>
          <div>
            <div className="text-[10px] uppercase text-slate-500 mb-1 tracking-wider">Company lookup</div>
            <code className={codeCls}>{`GET  {proxyUrl}/informa/company/{cif}
     X-API-Key: <key>
→ 200 OK   Informa JSON envelope
→ 404      CIF not in census
→ 401      bad key
→ 502/503  upstream Informa down`}</code>
          </div>
        </div>
        <details className="mt-3 text-[11px] text-slate-400">
          <summary className="cursor-pointer hover:text-slate-200 select-none">Reference proxy implementation (Node/Express)</summary>
          <code className={codeCls + ' mt-2'}>{`// Tecfys → Informa proxy
// env: INFORMA_USER, INFORMA_PASS, INFORMA_BASE_URL, TECFYS_API_KEY
import express from 'express';
const app = express();

app.use((req, res, next) => {
  res.set('Access-Control-Allow-Origin',  'https://app.tecfys.com');
  res.set('Access-Control-Allow-Headers', 'X-API-Key, Content-Type');
  if (req.method === 'OPTIONS') return res.sendStatus(204);
  next();
});

const requireKey = (req, res, next) =>
  req.headers['x-api-key'] === process.env.TECFYS_API_KEY
    ? next() : res.status(401).json({ error: 'bad key' });

app.get('/health', (_, res) => res.json({ status:'ok', mode:'live' }));

app.get('/informa/company/:cif', requireKey, async (req, res) => {
  const basic = Buffer.from(\`\${process.env.INFORMA_USER}:\${process.env.INFORMA_PASS}\`).toString('base64');
  const r = await fetch(\`\${process.env.INFORMA_BASE_URL}/get-product\`, {
    method: 'POST',
    headers: { Authorization: \`Basic \${basic}\`, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      productoSolicitado: 'informeFinanciero',
      parametrosCliente: { cif: req.params.cif }
    })
  });
  if (!r.ok) return res.status(502).json({ error: 'informa upstream' });
  res.json(await r.json());
});

app.listen(8080);`}</code>
        </details>
        <div className="text-[10px] text-slate-500 mt-3 leading-relaxed">
          The proxy can be deployed wherever (Cloud Run, Fly.io, AWS Lambda + API Gateway, a small VPS). It just needs to: hold Informa's HTTP Basic credentials, expose the two endpoints above with CORS for this app's origin, and ideally cache responses since Informa charges per query. Caching by CIF for 24h is a good starting point.
        </div>
      </div>
    </Card>
  );
}

/* =====================================================================
   VIEW: Loan Book
   Excel import parser — reads the "Import_data_example" template where:
     Row 1 col A = field label · cols B+ = one operation per column.
   The parser normalises labels, coerces numbers, auto-calculates IRR,
   scores each row through the standard scoring engine, and returns
   a preview array. Nothing is committed until the user confirms.
   ===================================================================== */

/** Normalise a header label so matching is tolerant of case/spaces/accents/parens. */
function normalizeLabel(s) {
  if (!s) return '';
  return String(s)
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

/** Header text on col A → key in the financials object we score against. */
const EXCEL_LABEL_MAP = {
  // Identification
  'client': 'name', 'name': 'name', 'client name': 'name', 'razon social': 'name',
  'nif': 'cif', 'cif': 'cif',
  'sector': 'sector',
  'country': 'country',
  'maturity years': 'maturityYears', 'maturity': 'maturityYears', 'years': 'maturityYears',
  'capital': 'shareCapital', 'share capital': 'shareCapital', 'capital social': 'shareCapital',
  // P&L
  'total revenue': 'totalRevenue', 'revenue': 'totalRevenue', 'sales': 'totalRevenue', 'ventas': 'totalRevenue',
  'gross margin': 'grossMargin', 'margen bruto': 'grossMargin',
  'ebitda': 'ebitda',
  'ebit': 'ebit',
  'net result': 'netResult', 'resultado neto': 'netResult', 'net income': 'netResult',
  'financial expenses': 'financialExpenses', 'gastos financieros': 'financialExpenses',
  // Balance
  'non current assets': 'nonCurrentAssets', 'activo no corriente': 'nonCurrentAssets',
  'current assets': 'currentAssets', 'activo corriente': 'currentAssets',
  'net equity': 'equity', 'equity': 'equity', 'patrimonio neto': 'equity',
  'non current liabilities': 'nonCurrentLiabilities', 'pasivo no corriente': 'nonCurrentLiabilities',
  'current liabilities': 'currentLiabilities', 'pasivo corriente': 'currentLiabilities',
  'receivables': 'receivables', 'payables': 'payables', 'procurement': 'procurement',
  // Operation
  'distributor': 'distributor', 'ditributor': 'distributor',
  'asset type': 'assetType',
  'product': 'productName', 'product name': 'productName',
  'duration': 'durationMonths', 'duration months': 'durationMonths',
  'amount': 'intervalPayment',           // in this template "Amount" is the periodic installment
  'installment': 'intervalPayment', 'interval payment amount': 'intervalPayment',
  'interval payment': 'paymentFrequency', // in this template "Interval payment" holds Monthly/Quarterly
  'payment frequency': 'paymentFrequency', 'frequency': 'paymentFrequency',
  'asset value capex': 'assetValue', 'asset value': 'assetValue', 'capex': 'assetValue', 'price capex': 'assetValue',
  'residual value': 'residualValue',
  'partner': 'partner',
  'target irr': 'irrManual', 'target irr auto': 'irrManual', 'irr': 'irrManual',
};

/** Section headers to skip (they contain no data). */
const EXCEL_SECTION_HEADERS = new Set([
  '1 client info', '2 profit and loss info', '3 balance sheet info', '4 operational details',
  'identification', 'profit and loss', 'balance sheet', 'operational details',
]);

/** Coerce a spreadsheet cell to a number if it looks numeric, else pass through. */
function coerceNumber(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return v;
  const s = String(v).trim().replace(/€|\s/g, '').replace(/\.(?=\d{3}(?:[.,]|$))/g, '').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? v : n;
}

/** Normalise a frequency string to 'monthly' | 'quarterly'. */
function coerceFrequency(v) {
  if (!v) return 'monthly';
  const s = String(v).toLowerCase();
  if (s.startsWith('quart') || s.startsWith('trimest')) return 'quarterly';
  return 'monthly';
}

/**
 * Match a free-form sector string to the canonical key in sectorRating.
 * Tolerant of "&"/"and", casing, extra whitespace, and trailing "s".
 * Returns the canonical key when a match is found, else the original input.
 */
function normalizeSectorName(input, sectorRatingMap) {
  if (!input) return input;
  if (sectorRatingMap[input]) return input;
  const canon = (s) => String(s).toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, ' ').trim();
  const target = canon(input);
  for (const k of Object.keys(sectorRatingMap)) {
    if (canon(k) === target) return k;
  }
  return input;
}

/**
 * Parse an ArrayBuffer of an .xlsx into an array of preview rows.
 * Each preview row = { rowIndex, financials, score, warnings }.
 */
async function parseLoanBookExcel(arrayBuffer, criteria) {
  if (typeof XLSX === 'undefined') throw new Error('The XLSX library did not load — check your internet connection and retry.');
  const wb = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  if (!sheet) throw new Error('The Excel file is empty.');
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null, raw: true });
  if (rows.length === 0) throw new Error('The sheet contains no rows.');

  // Determine how many operation columns there are (max non-null cells in any row past col A)
  const colCount = rows.reduce((max, r) => Math.max(max, (r || []).length), 0);
  if (colCount < 2) throw new Error('Expected labels in column A and at least one operation column (B, C, …).');

  // Build column-major data: for each operation column index (1..colCount-1), a { field → value } object.
  const perColumn = [];
  for (let c = 1; c < colCount; c++) {
    const record = {};
    let sawAnything = false;
    for (const row of rows) {
      if (!row) continue;
      const label = row[0];
      const value = row[c];
      const norm = normalizeLabel(label);
      if (!norm || EXCEL_SECTION_HEADERS.has(norm)) continue;
      // Strip leading numbering "2 " or "3 " that our normalizer sometimes leaves after a section header
      const key = EXCEL_LABEL_MAP[norm] || EXCEL_LABEL_MAP[norm.replace(/^\d+\s+/, '')];
      if (!key) continue;
      if (value !== null && value !== undefined && value !== '') sawAnything = true;
      if (key === 'paymentFrequency') {
        record[key] = coerceFrequency(value);
      } else if (key === 'sector') {
        record[key] = value == null ? '' : normalizeSectorName(String(value).trim(), criteria.sectorRating);
      } else if (key === 'country' || key === 'name' || key === 'cif' || key === 'partner' || key === 'distributor' || key === 'assetType' || key === 'productName') {
        record[key] = value == null ? '' : String(value).trim();
      } else if (key === 'irrManual') {
        // Ignore — we always auto-calculate
      } else {
        record[key] = coerceNumber(value);
      }
    }
    if (sawAnything && (record.name || record.cif)) {
      perColumn.push(record);
    }
  }

  if (perColumn.length === 0) throw new Error('No operation columns with a client name or CIF were found.');

  // Score each and compute IRR
  const preview = perColumn.map((rec, idx) => {
    const warnings = [];
    const financials = { ...EMPTY_FINANCIALS, ...rec };
    // Amount defaults to CAPEX if only CAPEX was given
    if (financials.assetValue && !financials.amount) financials.amount = financials.assetValue;
    if (!financials.paymentFrequency) financials.paymentFrequency = 'monthly';
    if (!financials.country) financials.country = 'ES';
    // Auto-compute the target IRR (never trust an imported manual number)
    financials.irr = computeTargetIRR({
      assetValue:     financials.assetValue,
      intervalPayment: financials.intervalPayment,
      residualValue:  financials.residualValue,
      durationMonths: financials.durationMonths,
      paymentFrequency: financials.paymentFrequency,
    });
    if (financials.assetValue && financials.intervalPayment && financials.durationMonths && financials.irr == null) {
      warnings.push('IRR could not be solved from these cash flows.');
    }
    if (!financials.assetValue && !financials.amount) warnings.push('No CAPEX / amount — operation will show 0€ exposure.');
    if (!financials.sector) warnings.push('No sector — will default to Professional services.');
    const scoreResult = score(financials, criteria);
    return { rowIndex: idx + 2, financials, scoreResult, warnings };
  });

  return preview;
}
